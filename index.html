<title>Case Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Outfit:wght@400;600&display=swap">
<style>
/* Layout: white sign-in → 5-step setup → app with a light side panel (full ≥1200px, icon rail below) and a calm two-pane Today view.
   70-30-10: 70% white/neutral · 30% navy secondary (nav icons, headers, secondary buttons) · 10% blue accent (main action, active state). Light mode only. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F7FB; --line:#E5EAF1; --ink:#172036; --muted:#66708A;
  --sec:#2E4A86; --sec-tint:#EEF3FB; --sec-tint-2:#DCE6F7; --on-sec:#FFFFFF;
  --accent:#2069F0; --accent-deep:#144CB8; --accent-tint:#E8F0FE; --on-accent:#FFFFFF;
  --ok:#1C8A55; --ok-tint:#E5F5EC; --warn:#A14A06; --warn-tint:#FFF3E3; --warn-line:#F2A65A; --bad:#C2412F; --bad-tint:#FDE9E6;
  --t4:#F6A04D; --t3:#2E4A86; --t2:#8FB0E6; --t1:#C9D3E3;
  --shadow:0 1px 2px rgba(23,32,54,.05),0 8px 24px rgba(23,32,54,.06);
  --f-disp:'Montserrat','Outfit',system-ui,Arial,sans-serif; --f-ui:'Outfit',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --r-sm:10px; --r-md:14px; --r-lg:20px; --pill:999px;
  --t-fast:150ms; --t-med:220ms; --t-slow:400ms; --ease:cubic-bezier(.2,.7,.2,1); --glide:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);height:100%}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-disp);margin:0;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)} .small{font-size:13px} .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none}

/* buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:8px 16px;border-radius:var(--r-sm);border:1.5px solid transparent;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease),background var(--t-fast)}
.btn-pri{background:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 var(--accent-deep)}
.btn-pri:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-deep)}
.btn-sec{background:var(--sec-tint);color:var(--sec);box-shadow:0 2px 0 var(--sec-tint-2)}
.btn-sec:active{transform:translateY(2px);box-shadow:none}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--sec)}
.btn-text{background:none;color:var(--sec);padding-inline:6px}
.btn-sm{min-height:34px;padding:5px 11px;font-size:13px}
.btn-lg{min-height:48px;padding:11px 20px;font-size:15.5px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important}
.ib{position:relative;overflow:hidden;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--sec);cursor:pointer}
.ib:hover{border-color:var(--sec)}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.16;transform:scale(0);pointer-events:none;animation:rip 550ms var(--glide) forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}
.pop{animation:pop 420ms var(--spring)} @keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.enter{animation:rise var(--t-slow) var(--ease) both} @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--sec-tint-2);border-top-color:var(--accent);animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* small atoms */
.tier{display:inline-flex;align-items:center;font-family:var(--f-disp);font-weight:700;font-size:11.5px;border-radius:var(--pill);padding:3px 9px;white-space:nowrap}
.t4{background:var(--warn-tint);color:var(--warn)} .t3{background:var(--sec-tint);color:var(--sec)} .t2{background:var(--sec-tint);color:var(--sec)} .t1{background:var(--surface-2);color:var(--muted)}
.av{display:inline-grid;place-items:center;border-radius:50%;font-family:var(--f-disp);font-weight:700;flex:none;background:var(--sec-tint);color:var(--sec)}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}.av.pic{background:none;overflow:visible}
.avgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;max-width:640px}.avgrid button{padding:0;border:0;background:none;border-radius:50%;cursor:pointer;aspect-ratio:1;box-shadow:0 0 0 2px transparent;transition:box-shadow .15s,transform .15s}.avgrid button:hover{transform:translateY(-2px)}.avgrid button[aria-checked=true]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--sec)}.avgrid img{width:100%;height:100%;border-radius:50%;display:block}@media (max-width:560px){.avgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.av.ring4{box-shadow:0 0 0 2.5px var(--surface),0 0 0 4.5px var(--t4)} .av.ring3{box-shadow:0 0 0 2.5px var(--surface),0 0 0 4.5px var(--t3)} .av.ring2{box-shadow:0 0 0 2.5px var(--surface),0 0 0 4.5px var(--t2)} .av.ring1{box-shadow:0 0 0 2.5px var(--surface),0 0 0 4.5px var(--t1)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border-radius:var(--pill);padding:3px 10px;background:var(--surface-2);color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag svg{width:14px;height:14px;flex:none}
.tag.w{background:var(--warn-tint);color:var(--warn)} .tag.i{background:var(--sec-tint);color:var(--sec)} .tag.ok{background:var(--ok-tint);color:var(--ok)} .tag.bad{background:var(--bad-tint);color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ok)} .dot.w{background:var(--warn-line)} .dot.bad{background:var(--bad)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ===== auth ===== */
.auth{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.auth-top{display:flex;justify-content:space-between;align-items:center;min-height:68px;max-width:1180px;width:100%;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:700;font-size:16px;color:var(--ink);text-decoration:none}
.logo i{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--sec);color:var(--on-sec);font-style:normal}
.logo i svg{width:18px;height:18px}
.auth-main{flex:1;display:grid;place-items:center;padding-block:16px 56px}
.acard{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.acard h1{font-size:26px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.field input,.field select{min-height:46px;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--surface)}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-tint)}
.field input[aria-invalid="true"]{border-color:var(--bad)}
.field .err{font-size:13px;color:var(--bad);font-weight:600}
.field .help{font-size:12.5px;color:var(--muted)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.gbtn{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 2px 0 var(--line)}
.gmark{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sec-tint);color:var(--sec);font-family:var(--f-disp);font-weight:700;font-size:12px}
.demo{background:var(--warn-tint);color:var(--warn);border-radius:var(--r-sm);padding:9px 12px;font-size:13px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent);flex:none}
.code{letter-spacing:.4em;font-size:22px;text-align:center;font-family:var(--f-disp)}

/* ===== onboarding ===== */
.onb{max-width:620px;margin:0 auto;padding-block:24px 56px;display:flex;flex-direction:column;gap:18px}
.onb-top{display:flex;justify-content:space-between;align-items:center}
.prog{display:flex;gap:6px}
.prog span{flex:1;height:6px;border-radius:6px;background:var(--surface-2);transition:background var(--t-med)}
.prog span.on{background:var(--accent)}
.ocard{display:flex;flex-direction:column;gap:18px;padding-block:8px}
.ocard h1{font-size:26px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.opt{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px;cursor:pointer;min-height:96px}
.opt svg{width:26px;height:26px;color:var(--sec)}
.opt b{font-size:14.5px}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-tint)}
.opt[aria-checked="true"] svg{color:var(--accent)}
.cap{display:flex;gap:10px;flex-wrap:wrap}
.cap button{position:relative;overflow:hidden;width:64px;height:64px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-disp);font-weight:700;font-size:22px;cursor:pointer;color:var(--sec)}
.cap button[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.srcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:0;padding:0;list-style:none}
.src{display:flex;flex-direction:column;gap:10px;border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px}
.src .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.src b{font-size:14px}
.tog{position:relative;width:44px;height:26px;border-radius:999px;background:var(--line);border:0;cursor:pointer;flex:none;transition:background var(--t-fast)}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform var(--t-med) var(--spring)}
.tog[aria-checked="true"]{background:var(--accent)}
.tog[aria-checked="true"]::after{transform:translateX(18px)}
.rules{display:flex;flex-direction:column;gap:10px}
.rule{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px 14px;cursor:pointer}
.rule input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.rule svg{width:22px;height:22px;color:var(--sec);flex:none}
.onb-foot{display:flex;justify-content:space-between;gap:10px}

/* ===== app shell ===== */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.shell.rail{grid-template-columns:72px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--surface-2);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:14px 10px calc(14px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));overflow-y:auto}
.side .logo{padding:4px 6px 16px}
.nav-item{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 12px;border-radius:12px;color:var(--sec);text-decoration:none;font-weight:600;font-size:14.5px;background:none;border:0;cursor:pointer;width:100%;text-align:left}
.nav-item svg{width:21px;height:21px;flex:none}
.nav-item:hover{background:var(--sec-tint)}
.nav-item[aria-current="page"]{background:var(--accent-tint);color:var(--accent)}
.nav-item[aria-current="page"]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent)}
.side .grow{flex:1}
.me{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;width:100%;text-align:left}
.me .av{width:34px;height:34px;font-size:13px;background:var(--sec);color:var(--on-sec)}
.me span{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.me b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shell.rail .nav-item span,.shell.rail .logo span,.shell.rail .me span,.shell.rail .side-toggle span{display:none}
.shell.rail .nav-item{justify-content:center;padding:8px}
.shell.rail .me{justify-content:center;border-color:transparent;background:none}
.side-toggle{display:flex;align-items:center;gap:10px;min-height:38px;padding:6px 12px;border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;border-radius:10px}
.shell.rail .side-toggle{justify-content:center}
.side-toggle:hover{background:var(--sec-tint)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:10px;min-height:60px}
.top h1{font-size:18px;flex:1;min-width:0}
.pill{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;min-height:38px;border-radius:var(--pill);border:1.5px solid var(--line);background:var(--surface);padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.top .avbtn{position:relative;overflow:hidden;border:0;padding:0;background:none;cursor:pointer;border-radius:50%}
.top .avbtn .av{width:38px;height:38px;font-size:14px;background:var(--sec);color:var(--on-sec)}
main.am{padding-block:20px 48px;max-width:1320px;width:100%;margin:0 auto}
.view{display:flex;flex-direction:column;gap:18px}

/* ===== today ===== */
.hello{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hello h2{font-size:22px}
.today{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:18px;align-items:start}
.queue{display:flex;flex-direction:column;gap:6px}
.qrow{position:relative;overflow:hidden;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1.5px solid transparent;border-radius:var(--r-md);padding:10px;cursor:pointer;transition:background var(--t-fast),border-color var(--t-fast)}
.qrow:hover{background:var(--surface-2)}
.qrow[aria-current="true"]{background:var(--accent-tint);border-color:var(--accent)}
.qrow .av{width:40px;height:40px;font-size:14px}
.qrow .nm{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:6px;min-width:0}
.qrow .nm b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.qrow .tags{margin-top:4px;flex-wrap:nowrap;overflow:hidden}
.qrow .num{font-family:var(--f-disp);font-weight:700;font-size:13px;color:var(--muted);width:18px;text-align:center}
.qrow.done{opacity:.55}
.qmove{display:flex;flex-direction:column;gap:2px;opacity:0;transition:opacity var(--t-fast)}
.qrow:hover .qmove,.qrow:focus-within .qmove,.qrow[aria-current="true"] .qmove{opacity:1}
.qmove button{width:26px;height:22px;border:1px solid var(--line);background:var(--surface);border-radius:7px;cursor:pointer;font-size:11px;color:var(--sec)}
.divider{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 4px}
.divider::before,.divider::after{content:"";flex:1;border-top:1.5px dashed var(--line)}
.override{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface-2);border-radius:10px;padding:8px;cursor:default}
.override select{min-height:36px;border:1.5px solid var(--line);border-radius:9px;padding:4px 8px;background:var(--surface);font-size:13px}
.moved{grid-column:2/-1;font-size:12px;color:var(--sec);font-weight:600}
.ws{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);min-width:0;overflow:hidden}
.ws-h{display:flex;align-items:center;gap:14px;padding:16px 18px 10px;flex-wrap:wrap}
.ws-h .av{width:52px;height:52px;font-size:18px}
.ws-h h2{font-size:20px}
.ws-h .sub{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tabs{display:flex;gap:4px;padding:0 14px;border-bottom:1px solid var(--line)}
.tabs button{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px;background:none;border:0;border-bottom:2.5px solid transparent;padding:10px 10px;min-height:44px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.tabs button svg{width:17px;height:17px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.ws-b{padding:16px 18px 20px;display:flex;flex-direction:column;gap:18px}
.fresh{display:flex;flex-wrap:wrap;gap:6px}
.fresh .tag{background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:500}
.fresh .tag b{font-weight:600;color:var(--muted)}
.steps{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.step{display:flex;align-items:center;gap:8px;background:var(--sec-tint);border-radius:var(--pill);padding:5px 12px 5px 5px;font-size:13.5px;font-weight:600;color:var(--sec)}
.step i{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sec);color:var(--on-sec);font-style:normal;font-size:12px}
.step.first{background:var(--accent-tint);color:var(--accent)} .step.first i{background:var(--accent)}
.arrow{color:var(--muted);font-size:13px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.blk{display:flex;flex-direction:column;gap:8px;min-width:0}
.cmp{display:grid;grid-template-columns:minmax(0,1.2fr) repeat(3,minmax(0,1fr)) auto;gap:6px 8px;align-items:center;font-size:13.5px}
.cmp .h{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cmp .d{font-weight:600}
.cmp .v{display:flex;align-items:center;gap:6px;min-width:0}
.cmp .v span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp .row-line{grid-column:1/-1;border-top:1px solid var(--line)}
.card{border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.alert{border-color:var(--warn-line);background:var(--warn-tint)}
.card.good{border-color:var(--ok);background:var(--ok-tint)}
.card h3{font-size:14px;font-family:var(--f-ui);font-weight:600;display:flex;gap:8px;align-items:center}
.card h3 svg{width:18px;height:18px}
.contact{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:var(--r-md);padding:10px;flex-wrap:wrap}
.contact .ic{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--sec-tint);color:var(--sec);flex:none}
.contact .t{flex:1;min-width:140px;display:flex;flex-direction:column}
.contact .t b{font-size:14px}
.contact .t span{font-size:12.5px;color:var(--muted)}
.contact.done{border-color:var(--ok);background:var(--ok-tint)}
.contact.fail{background:var(--surface-2)}
.outs{display:flex;gap:6px}
.loops{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.loop{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--surface-2);font-size:13.5px}
.loop .t{flex:1;min-width:0}
.loop .chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--sec-tint-2);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;color:var(--surface)}
.loop.done{background:var(--ok-tint)} .loop.done .chk{background:var(--ok);border-color:var(--ok)}
.loop.done .t{color:var(--ok)}
details.ai{border:1.5px dashed var(--muted);border-radius:var(--r-md);padding:8px 12px;font-size:13.5px}
details.ai summary{cursor:pointer;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;min-height:30px}
details.ai p{margin-top:6px}
.medrow select{width:100%;min-height:38px;border:1.5px solid var(--warn-line);border-radius:9px;padding:4px 8px;background:var(--surface);font-size:13.5px}
.medrow select.set{border-color:var(--ok)}
.area{display:flex;flex-direction:column;gap:6px}
.area .ev{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.area textarea{width:100%;min-height:64px;resize:vertical;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface)}
.area textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-tint)}
.sign{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;background:var(--surface-2);border-radius:var(--r-md);padding:10px 12px}
.sign .st{font-weight:600;font-size:13.5px;display:flex;gap:8px;align-items:center}
.st.ok{color:var(--ok)} .st.no{color:var(--warn)}
.audit{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.chat{display:flex;flex-direction:column;gap:10px;min-height:80px}
.bub{max-width:72ch;border-radius:14px;padding:9px 13px;font-size:14px;line-height:1.5}
.bub.me{align-self:flex-end;background:var(--sec);color:var(--on-sec);border-radius:14px 14px 4px 14px}
.bub.bot{align-self:flex-start;background:var(--surface-2);border:1.5px dashed var(--muted);border-radius:14px 14px 14px 4px}
.bub.bot ul{margin:6px 0 0;padding-left:18px}
.bub .srcs-line{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;min-height:44px;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface)}
.ask input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-tint)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:24px;color:var(--muted)}
.empty svg{width:40px;height:40px;color:var(--sec-tint-2)}
.skel{display:flex;flex-direction:column;gap:8px}
.sk{height:60px;border-radius:var(--r-md);background:linear-gradient(90deg,var(--surface-2),#FFFFFF,var(--surface-2));background-size:200% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* other views */
.panel{border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-size:16px}
.tiers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tcard{border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:4px;background:var(--surface-2)}
.tcard b{font-family:var(--f-disp);font-size:24px}
.tcard span{font-size:12.5px;color:var(--muted)}
.tcard.t4c{background:var(--warn-tint)} .tcard.t4c b{color:var(--warn)}
.tcard.t3c{background:var(--sec-tint)} .tcard.t3c b{color:var(--sec)}
.mlist{display:flex;flex-direction:column;gap:6px}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px;border-radius:12px}
.mrow:hover{background:var(--surface-2)}
.mrow .av{width:36px;height:36px;font-size:13px}
.search{min-height:40px;border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;width:100%;max-width:280px}
.gates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.gate{display:flex;flex-direction:column;gap:6px;align-items:flex-start;border-radius:var(--r-md);padding:12px;background:var(--ok-tint)}
.gate svg{width:22px;height:22px;color:var(--ok)}
.gate span{font-size:13px}
.sched{display:flex;flex-direction:column;gap:6px}
.transcript{display:flex;flex-direction:column;gap:8px}
.line{border-radius:14px;padding:8px 12px;font-size:14px;max-width:60ch}
.line.ai{background:var(--surface-2);border:1.5px dashed var(--muted)}
.line.mem{background:var(--sec-tint);color:var(--sec);align-self:flex-end}
.line.sys{background:var(--warn-tint);color:var(--warn);font-weight:600}
.line.sys.ok{background:var(--ok-tint);color:var(--ok)}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:10px 16px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.prof-head{display:flex;gap:16px;align-items:center}
.prof-head .av{width:64px;height:64px;font-size:22px;background:var(--sec);color:var(--on-sec)}

/* profile popover + sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(23,32,54,.28);z-index:50}
.pop-panel{position:fixed;z-index:51;width:min(340px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 18px 50px rgba(23,32,54,.18);padding:18px;display:flex;flex-direction:column;gap:14px;animation:rise var(--t-med) var(--ease)}
.pop-panel .kv{grid-template-columns:96px minmax(0,1fr);font-size:13.5px;gap:6px 12px}
.sheet{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 24px));max-height:85vh;overflow:auto;background:var(--surface);border-radius:var(--r-lg);box-shadow:0 18px 50px rgba(23,32,54,.18);padding:20px;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#FFFFFF;border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px;box-shadow:0 8px 28px rgba(0,0,0,.2);z-index:60;max-width:calc(100% - 32px);animation:rise var(--t-med) var(--ease)}

@media (max-width:1100px){.tiers{grid-template-columns:repeat(3,minmax(0,1fr))}.gates{grid-template-columns:repeat(2,minmax(0,1fr))}}

 if(f.id==="gform"){A.email=$("#gemail").value.trim();if(!EMAIL.test(A.email)){A.err.gemail="Enter an address like name@gmail.com";renderAuth()}else signIn(A.email,A.mode==="signup"?A.name:"","google")}
 if(f.id==="cform"){const v=$("#code").value.replace(/\s/g,"");if(v!=="246810"){A.err.code=v.length<6?"Enter all 6 digits":"Wrong code. Try 246810";renderAuth()}else signIn(A.email,A.name,"email")}
});
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act,id=t.dataset.id,m=M[id];
 switch(a){
 case "layer-close":closeLayer();break;
 case "to-profile":closeLayer();go("profile");break;
 case "pick-av":ST.user.av=t.dataset.v;save();renderApp("profile");toast("Profile picture updated");break;
 case "google":authStep.phase="google";authStep.err={};renderAuth();break;
 case "auth-back":authStep.phase="form";authStep.err={};renderAuth();break;
 case "role":ST.onb.role=t.dataset.v;save();document.querySelectorAll('[data-act="role"]').forEach(b=>b.setAttribute("aria-checked",b.dataset.v===ST.onb.role));onbNextState();break;
 case "cap":ST.onb.cap=+t.dataset.v;save();document.querySelectorAll('[data-act="cap"]').forEach(b=>b.setAttribute("aria-checked",+b.dataset.v===ST.onb.cap));break;
 case "pcap":ST.onb.cap=+t.dataset.v;save();document.querySelectorAll('[data-act="pcap"]').forEach(b=>b.setAttribute("aria-checked",+b.dataset.v===ST.onb.cap));toast(`Queue cut at ${ST.onb.cap}`);break;
 case "onb-back":ST.onb.step=Math.max(0,ST.onb.step-1);save();renderOnb();break;
 case "onb-next":{const O=ST.onb;if(O.step===1)O.program=$("#oprog").value;if(O.step<4){O.step++;save();renderOnb();window.scrollTo(0,0)}else{O.done=true;save();buzz(15);toast(`Welcome, ${first()}`);redirect("today")}break}
 case "src-tog":{const x=ST.src[+t.dataset.i];x.on=!x.on;save();t.setAttribute("aria-checked",x.on);const st=$("#st-"+t.dataset.i);if(st)st.innerHTML=srcStatus(x,+t.dataset.i);onbNextState();break}
 case "src-test":testSources();break;
 case "src-retry":testSources(+t.dataset.i);break;
 case "logout":closeLayer();ST.user=null;save();authStep={mode:"login",phase:"form",email:"",name:"",org:"",err:{}};lastView="";toast("Signed out");redirect("login");break;
 case "replay-onb":ST.onb.done=false;ST.onb.step=0;lastOnbStep=-1;save();redirect("onboarding");break;
 case "reset-demo":{const u=ST.user,o=ST.onb,ui=ST.ui;ST=fresh();ST.user=u;ST.onb=o;ST.ui=ui;M=ST.M;W=ST.W;loadedToday=false;save();toast("Members reset");go("today");break}
 case "open-member":W.sel=id;W.sub="brief";save();break;
 case "pick":if(e.target.closest(".qmove,.override"))return;sel(id,W.done[id]?"attest":"brief");break;
 case "sub":W.sub=t.dataset.s;save();renderWS();break;
 case "go-attest":sel(id,"attest");break;
 case "mv":override={id,d:+t.dataset.d};renderQueue();setTimeout(()=>{const s=$("#ovr");s&&s.focus()},0);break;
 case "mv-cancel":override=null;renderQueue();break;
 case "mv-ok":{const r=$("#ovr").value;if(!r){toast("Pick a reason");return}const q=W.queue,i=q.indexOf(override.id),j=i+override.d;if(j>=0&&j<q.length)[q[i],q[j]]=[q[j],q[i]];W.moved[override.id]=r;log(override.id,"You",`Moved ${override.d<0?"up":"down"}: ${r}`);override=null;save();renderQueue();toast("Moved · never scored");break}
 case "call":{const r=m.reach.find(x=>x.id===t.dataset.r);r.log=t.dataset.o;tick(r.log==="Reached"?12:5);r.at=(id==="harold"&&r.id==="susan"&&r.log==="Reached")?"6:40 pm":clock();log(id,"You",`${r.who.split(" ·")[0]}: ${r.log}`);if(r.log==="Reached"){W.convos++;buzz(15);toast("Conversation logged")}else toast(`${r.log} logged`);save();renderWS();break}
 case "find":{const s=m.steps.find(x=>x.id===t.dataset.r);s.log=t.dataset.o;tick(5);s.at=clock();log(id,"You",`${s.t.split(" (")[0]}: ${s.log}`);if(s.log==="Reached"){W.convos++;m.fresh=m.fresh.map(f=>f[0]==="Home phone"?["Home phone","Updated","ok"]:f);m.qchips=[["Reached","i"]];buzz(15);toast("Reached · number updated")}else toast(s.id==="chw"?"CHW visit requested":"Logged");save();renderWS();renderQueue();break}
 case "dup":m.dup.dec=t.dataset.o;tick(2);log(id,"You",t.dataset.o);save();renderWS();break;
 case "tier":m.tierchg.dec=t.dataset.o;if(t.dataset.o.includes("3"))m.tier="3";else m.tier="2";tick(2);log(id,"You",t.dataset.o);save();renderQueue();renderWS();break;
 case "step":m.step.dec=t.dataset.o;log(id,"You",t.dataset.o);save();renderWS();break;
 case "auth":m.auth.sent="sent";m.fresh=m.fresh.map(f=>f[0]==="Caregiver authorization"?["Caregiver form","Sent Mon","stale"]:f);log(id,"You","Authorization form sent");save();renderWS();toast("Form sent");break;
 case "loop":{const l=m.loops[+t.dataset.i];if(l.go){go(l.go);return}l.done=l.doneTxt;tick(3);log(id,"You",l.doneTxt);save();renderWS();toast(l.doneTxt);break}
 case "note":toast(t.dataset.t);break;
 case "ask-q":ask(W.sel,t.dataset.q);break;
 case "sign":{if(signWhy(id).length)return;tick(4);W.done[id]="at "+clock();log(id,"You","Note signed");save();buzz(18);renderQueue();renderWS();const sb=$("#signbar");sb&&sb.classList.add("pop");toast(`${m.name}: signed`);break}
 case "ai-play":W.aiStep=Math.min(CALL.length,W.aiStep+1);renderCall();break;
 case "ai-reset":W.aiStep=0;save();renderCall();break;
 }
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("qrow")){e.preventDefault();e.target.click()}if(e.key==="Escape")closeLayer()});
document.addEventListener("change",e=>{const s=e.target;
 if(s.dataset&&s.dataset.med!==undefined){const m=M[s.dataset.id],x=m.meds[+s.dataset.med];x.dec=s.value;s.classList.toggle("set",!!s.value);if(x.dec){tick(2);log(s.dataset.id,"You",`${x.drug}: ${x.dec}`)}const ev=document.querySelector('[data-ev="0"] span');if(ev)ev.textContent=areaList(m)[0][1]();save();renderSign(s.dataset.id)}
 if(s.dataset&&s.dataset.rule!==undefined){ST.onb.rules[+s.dataset.rule]=s.checked;save();onbNextState()}
 if(s.id==="oprog"){ST.onb.program=s.value;save()}});
document.addEventListener("input",e=>{const s=e.target;
 if(s.dataset&&s.dataset.con!==undefined){(W.attest[s.dataset.id]||(W.attest[s.dataset.id]={}))[+s.dataset.con]=s.value;save();renderSign(s.dataset.id)}
 if(s.id==="ocase"){const v=parseInt(s.value,10);ST.onb.caseload=isNaN(v)?0:v;save();onbNextState()}
 if(s.id==="csearch")drawCase(s.value.trim());
 if(s.id==="code")s.value=s.value.replace(/\D/g,"").slice(0,6)});

$("#srcPill").addEventListener("click",sheetSources);
$("#topAv").addEventListener("click",e=>openProfile(e.currentTarget));
$("#meBtn").addEventListener("click",e=>openProfile(e.currentTarget));
route();
})();
